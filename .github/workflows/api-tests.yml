name: Banking API Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation framework
        uses: actions/checkout@v4

      - name: Checkout banking application
        uses: actions/checkout@v4
        with:
          repository: Kattempudi-John/banking-app-microservices
          path: banking-app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show checked out folders
        run: ls -la

      - name: Run existing API tests
        run: mvn clean test