name: Banking API Automation

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automation framework
        uses: actions/checkout@v4

      - name: Checkout banking application
        uses: actions/checkout@v4
        with:
          repository: Kattempudi-John/banking-app-microservices
          path: banking-app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start banking application
        working-directory: banking-app
        run: docker compose up -d --build

      - name: Show running containers
        run: docker ps

      - name: Wait for services to start
        run: sleep 60

      - name: Run API tests
        run: mvn clean test

      - name: Stop banking application
        if: always()
        working-directory: banking-app
        run: docker compose down -v